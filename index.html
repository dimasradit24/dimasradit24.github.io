
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video -->
    <video autoplay muted loop id="bg-video">
        <source src="video.mp4" type="video/mp4">
    

    <div class="overlay">

        <h1>Happy Birthday 🎂</h1>

        <p class="subtitle">
            Hari ini bukan cuma tentang bertambahnya usia,
            tapi tentang betapa berharganya kamu.

            semoga apa yang kamu impikan satu persatu bisa tercapai ya. 

            makasih karena tanpa sadar pernah ada di bagian cerita hidup aku

            always happy yaa
        </p>

        <button id="playMusic">
            ▶ Putar Musik
        </button>

    </div>

    <audio id="music">
        <source src="music.mp3" type="audio/MPEG">
    </audio>

    <script src="script.js"></script>

</body>
</html>
